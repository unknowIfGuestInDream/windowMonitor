name: Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-artifact:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Resolve version & stage files (Windows)
        shell: pwsh
        run: scripts\prepare-windows-build.ps1

      - name: Download JRE (Windows)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        shell: pwsh
        run: |
          Push-Location staging
          & ..\scripts\jre.ps1
          Pop-Location

      - name: Package artifact (Windows)
        shell: pwsh
        run: |
          Compress-Archive -Path 'staging\*' -DestinationPath "dist/windowMonitor-windows-$env:APP_VERSION.zip" -Force
          Write-Host "Created dist/windowMonitor-windows-$env:APP_VERSION.zip"
          Remove-Item -Path 'staging' -Recurse -Force

      - name: Create Windows Service installer (jpackage)
        shell: pwsh
        run: scripts\build-service.ps1 -AppJar $env:APP_JAR -AppVersion $env:APP_VERSION

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: windowMonitor-windows
          path: dist/windowMonitor-windows-${{ env.APP_VERSION }}.zip
          retention-days: 7

      - name: Upload service installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windowMonitor-windows-service
          path: dist/windowMonitor-windows-service-${{ env.APP_VERSION }}.msi
          retention-days: 7
