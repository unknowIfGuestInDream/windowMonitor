name: Release

on:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        shell: bash
        run: mvn -B clean package --no-transfer-progress -DskipTests

      - name: Resolve version & stage files
        shell: pwsh
        run: scripts\prepare-windows-build.ps1

      - name: Download JRE
        shell: pwsh
        run: |
          Push-Location staging
          & ..\scripts\jre.ps1
          Pop-Location

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path 'staging\*' -DestinationPath "dist/windowMonitor-windows-$env:APP_VERSION.zip" -Force
          Write-Host "Created dist/windowMonitor-windows-$env:APP_VERSION.zip"
          Remove-Item -Path 'staging' -Recurse -Force

      - name: Create Windows Service installer (jpackage)
        shell: pwsh
        run: scripts\build-service.ps1 -AppJar $env:APP_JAR -AppVersion $env:APP_VERSION

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
