# Auto-update configuration
# GitHub API URL for fetching the latest release tag
# e.g. https://api.github.com/repos/owner/repo/releases/latest
update.apiUrl=https://api.github.com/repos/unknowIfGuestInDream/windowMonitor/releases/latest

# Base download URL for release assets
# The updater will append the asset filename automatically
# e.g. https://github.com/owner/repo/releases/download
update.downloadBaseUrl=https://github.com/unknowIfGuestInDream/windowMonitor/releases/download

# Asset filename pattern to download (supports {version} placeholder)
update.assetName=windowmonitor-windows-{version}.zip

# Current installed version (overridden at runtime from the running jar manifest)
update.currentVersion=1.0.1

# Whether auto-update is enabled
update.enabled=true
